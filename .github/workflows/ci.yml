name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fraudlens_test
          POSTGRES_USER: fraudlens
          POSTGRES_PASSWORD: fraudlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraudlens -d fraudlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://fraudlens:fraudlens_test@localhost:5432/fraudlens_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: fraudlens_test
          POSTGRES_USER: fraudlens
          POSTGRES_PASSWORD: fraudlens_test
        run: PYTHONPATH=src python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linter
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check src/ tests/

      - name: Lint
        run: ruff check src/ tests/

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build --target api -t fraudlens-api .

      - name: Build Dashboard image
        run: docker build --target dashboard -t fraudlens-dashboard .

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraudlens
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: fraudlens_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlens -d fraudlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fraudlens:fraudlens_dev@postgres:5432/fraudlens
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fraudlens
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: fraudlens_dev
      FRAUDLENS_MODEL_PATH: /app/models/random_forest.artifact.pkl
      FRAUDLENS_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model-data:/app/models

  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://fraudlens:fraudlens_dev@postgres:5432/fraudlens
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fraudlens
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: fraudlens_dev
      FRAUDLENS_MODEL_DIR: /app/models
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model-data:/app/models

volumes:
  pgdata:
  model-data:
